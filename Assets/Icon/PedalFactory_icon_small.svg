<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<g transform="translate(512 512) scale(1.25) translate(-480 -540)">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a2e"/>
      <stop offset="0.55" stop-color="#e2461b"/>
      <stop offset="1" stop-color="#a82a10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb07a"/>
      <stop offset="1" stop-color="#6e1b08"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e9e3d6"/>
      <stop offset="1" stop-color="#8f877a"/>
    </radialGradient>
    <radialGradient id="chrome" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d7dbe0"/>
      <stop offset="0.7" stop-color="#7d838b"/>
      <stop offset="1" stop-color="#3b3f45"/>
    </radialGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c0"/>
      <stop offset="0.35" stop-color="#ff3b2f"/>
      <stop offset="1" stop-color="#ff3b2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6270"/>
      <stop offset="1" stop-color="#2a2f38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- stompbox -->
  <g filter="url(#shadow)">
    <rect x="200" y="150" width="560" height="780" rx="70" fill="url(#rim)"/>
    <rect x="216" y="164" width="528" height="750" rx="58" fill="url(#body)"/>
    <!-- top highlight -->
    <rect x="236" y="180" width="488" height="120" rx="48" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- knobs -->
  <g>
    <circle cx="318" cy="324" r="76" fill="#3a1006" opacity="0.45"/>
    <circle cx="318" cy="318" r="72" fill="url(#knob)" stroke="#5d564c" stroke-width="6"/>
    <rect x="311" y="254" width="14" height="54" rx="7" fill="#2a2520" transform="rotate(-45 318 318)"/>
    <circle cx="480" cy="324" r="76" fill="#3a1006" opacity="0.45"/>
    <circle cx="480" cy="318" r="72" fill="url(#knob)" stroke="#5d564c" stroke-width="6"/>
    <rect x="473" y="254" width="14" height="54" rx="7" fill="#2a2520" transform="rotate(0 480 318)"/>
    <circle cx="642" cy="324" r="76" fill="#3a1006" opacity="0.45"/>
    <circle cx="642" cy="318" r="72" fill="url(#knob)" stroke="#5d564c" stroke-width="6"/>
    <rect x="635" y="254" width="14" height="54" rx="7" fill="#2a2520" transform="rotate(40 642 318)"/>
  </g>

  <!-- LED -->
  <circle cx="480" cy="520" r="62" fill="url(#led)"/>
  <circle cx="480" cy="520" r="22" fill="#ff2a1f" stroke="#5b0d06" stroke-width="5"/>
  <circle cx="474" cy="514" r="7" fill="#ffffff" opacity="0.85"/>

  <!-- footswitch -->
  <circle cx="480" cy="790" r="110" fill="#2a0c04" opacity="0.5"/>
  <circle cx="480" cy="780" r="104" fill="url(#chrome)" stroke="#2b2e33" stroke-width="6"/>
  <circle cx="480" cy="780" r="66" fill="none" stroke="#5c6168" stroke-width="5" opacity="0.7"/>
  <circle cx="480" cy="780" r="40" fill="url(#chrome)" stroke="#3b3f45" stroke-width="4"/>
</g>
</svg>
